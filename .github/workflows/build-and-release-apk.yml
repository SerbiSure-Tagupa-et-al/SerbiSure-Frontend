name: Publish native Android release
on:
  workflow_run:
    workflows: [Release safety]
    types: [completed]
    branches: [main]
permissions:
  contents: write
  actions: read
concurrency:
  group: production-native-release
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.repository == 'SerbiSure-Tagupa-et-al/SerbiSure-Frontend' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: plan
      - name: Validate the trusted build plan
        id: plan
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          node -e 'const fs=require("fs"),p=require("./plan/release-plan.json");if(p.sha!==process.env.EXPECTED_SHA||typeof p.native!=="boolean"||p.ota&&p.native)throw Error("Invalid plan");fs.appendFileSync(process.env.GITHUB_OUTPUT,`native=${p.native}\n`);'
      - uses: actions/download-artifact@v4
        if: steps.plan.outputs.native == 'true'
        with:
          name: android-release-apks
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: apks
      - name: Prepare the APKs compiled and tested at this exact commit
        if: steps.plan.outputs.native == 'true'
        id: version
        run: |
          node scripts/prepare-release.cjs
          echo "tag=v$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Refuse to overwrite an existing published release
        if: steps.plan.outputs.native == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > existing-release.json 2> release-error.txt; then
            node -e 'if(require("./existing-release.json").draft!==true)throw Error("A published release cannot be overwritten")'
          elif ! grep -q 'HTTP 404' release-error.txt; then
            cat release-error.txt
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          fi
      - uses: actions/setup-node@v4
        if: steps.plan.outputs.native == 'true'
        with:
          node-version: 20
      - name: Prepare friendly release notes with a safe five-second fallback
        if: steps.plan.outputs.native == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/generate-release-notes.cjs
      - name: Create a draft with complete APK assets and friendly notes
        if: steps.plan.outputs.native == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: SerbiSure ${{ steps.version.outputs.tag }}
          body_path: dist/release-notes.md
          generate_release_notes: false
          draft: true
          fail_on_unmatched_files: true
          files: dist/apks/*
      - name: Publish only after all assets are uploaded
        if: steps.plan.outputs.native == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName > published-releases.json
          LATEST=$(node -e 'const {compare}=require("./scripts/release-policy.cjs"),p=require("./published-releases.json");let old=p[0]?.tagName.replace(/^v/,"");if(/^\d+\.\d+$/.test(old))old+=".0";console.log(!p.length||compare(process.env.RELEASE_TAG.replace(/^v/,""),old)>0?"true":"false")')
          gh release edit "$RELEASE_TAG" --draft=false --latest="$LATEST"
